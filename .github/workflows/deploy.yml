name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set Environment Variables
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_USER }}" ] || [ -z "${{ secrets.DEPLOY_DIR }}" ]; then
            echo "Error: Required GitHub Secrets (SSH_HOST, SSH_USER, DEPLOY_DIR) are not configured."
            exit 1
          fi
          echo "TARGET_HOST=${{ secrets.SSH_HOST }}" >> $GITHUB_ENV
          echo "SSH_USER=${{ secrets.SSH_USER }}" >> $GITHUB_ENV
          echo "DEPLOY_DIR=${{ secrets.DEPLOY_DIR }}" >> $GITHUB_ENV
          echo "PM2_APP_NAME=${{ secrets.PM2_APP_NAME || 'lumenist' }}" >> $GITHUB_ENV

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Scan Target Host Key
        run: |
          ssh-keyscan -H ${{ env.TARGET_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy, Restart, and Verify Application
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          PM2_APP_NAME: ${{ env.PM2_APP_NAME }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ env.SSH_USER }}@${{ env.TARGET_HOST }} \
            "DEPLOY_DIR='$DEPLOY_DIR' PM2_APP_NAME='$PM2_APP_NAME' bash -s" << 'EOF'
            set -e
            echo "=== Deploying $PM2_APP_NAME ==="
            cd "$DEPLOY_DIR"

            echo "=== Syncing latest changes from main ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Installing dependencies ==="
            npm install --prefer-offline --no-audit

            echo "=== Building Next.js application ==="
            npm run build

            echo "=== Restarting PM2 process ==="
            pm2 restart "$PM2_APP_NAME"

            echo "=== Verifying local Next.js service health ==="
            HEALTHY=0
            for i in $(seq 1 10); do
              sleep 1
              if curl -sS --fail -I http://localhost:3000/ > /dev/null 2>&1; then
                echo "Local service health check passed on attempt $i."
                HEALTHY=1
                break
              fi
              echo "Waiting for Next.js to initialize (attempt $i/10)..."
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "Error: Local service health check failed on http://localhost:3000/!"
              pm2 logs "$PM2_APP_NAME" --lines 50
              exit 1
            fi

            echo "=== PM2 Status ==="
            pm2 status "$PM2_APP_NAME"
            echo "=== Deployment successful and verified! ==="
          EOF
